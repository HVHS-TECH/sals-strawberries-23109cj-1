<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Sals new york style Strawberrys</title>
  <link rel="icon" type="image/x-icon" href="assets/images/dtec_favicon.png">

  <link href="style.css" rel="stylesheet" type="text/css" />

  <!-- firebase start ****************************************-->
  <!-- Firebase App (core Firebase SDK) is always required & must be listed 1st -->
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-app.js"></script>
  <!-- Add Firebase products that you want to use -->
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-analytics.js"></script>
  <!-- firebase end ******************************************-->
  <script src="fb_setup.js"></script>
  <script src="fb_io.js"></script>

</head>
<body>
  <div class="container">
    <h1>Sal’s new york style Strawberry Saloon</h1>
    <h2>(and other fruit products)</h2>

    <div id="login">    
      <button onclick="fb_login()">Login</button> 
    </div>
    <div id="logout">    
    </div>
    <form id="fruitForm">

      <label for="favoriteFruit">Favorite Fruit:</label>
      <input type="text" id="favoriteFruit" name="favoriteFruit" maxlength="20" />

      <label for="2ndfavoriteFruit">2nd Favorite Fruit:</label>
      <input type="text" id="2ndfavoriteFruit" name="2ndfavoriteFruit" maxlength="20" required />

      <label for="3rdfavoriteFruit">3rd Favorite Fruit:</label>
      <input type="text" id="3rdfavoriteFruit" name="3rdfavoriteFruit" maxlength="20" required />

      <label for="fruitQuantity">How many servings per week?</label>
      <input type="number" id="fruitQuantity" name="fruitQuantity" maxlength="10"required />
      
      <!-- add more fields here -->
      <label for="review">Leave a Review:</label>
      <input type="text" id="review" name="review" maxlength="1000"/>
    </form>

    <button onclick="fb_write()">Submit</button>
    <button onclick="fb_readEmail()">Generate email</button>
    <button onclick="fb_readReviews()">Read reviews</button>
    <button onclick="fb_readPopularFruit()">See what frutis are popular</button>
    <button onclick="fb_adminRead()">ADMIN</button>
    <div id="output"></div>
  </div>
</body>
<script src="script.js"></script>
</html>
